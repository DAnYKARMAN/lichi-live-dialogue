[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Permet d'appeler les fonctions via /api/nom-de-la-fonction
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Le micro doit être autorisé sur ce site
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "microphone=(self)"
