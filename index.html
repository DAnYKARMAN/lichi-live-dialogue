<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lichi Live – Dialogue EN-HE</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
<meta name="theme-color" content="#B3124A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lichi EN-HE">
<style>
  :root{
    --accent:#B3124A;
    --accent2:#E0245E;
    --bg:#F6F4F5;
    --panel:#FFFFFF;
    --text:#1B1B1F;
    --muted:#7A7380;
    --line:#E6E1E4;
    --fs:1;                 /* taille du texte (bouton Aa) */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif}
  body{overflow:hidden}
  button{font-family:inherit}

  /* ---------- ÉCRAN D'ACCUEIL ---------- */
  #home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:28px;text-align:center;gap:14px}
  #home img{width:110px;height:110px;border-radius:26px;box-shadow:0 8px 26px rgba(138,46,67,.22)}
  #home h1{margin:6px 0 0;font-size:2rem;letter-spacing:-.02em}
  #home .pair{font-size:1.1rem;color:var(--accent);font-weight:700}
  #home .info{color:var(--muted);font-size:.95rem;min-height:1.3em}
  #btnStart{margin-top:18px;border:none;border-radius:999px;padding:18px 40px;font-size:1.2rem;
    font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent));
    box-shadow:0 10px 26px rgba(179,18,74,.35);cursor:pointer}
  #btnStart:disabled{opacity:.4}
  .err{color:#B00020;background:#FDECEF;border:1px solid #F5C2CC;border-radius:12px;
    padding:12px 14px;font-size:.95rem;display:none;max-width:420px}

  /* ---------- ÉCRAN DE DIALOGUE ---------- */
  #talk{position:fixed;inset:0;display:none;flex-direction:column}
  #talk.on{display:flex}

  .half{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel)}
  /* La moitié du HAUT est retournée : la personne en face la lit à l'endroit. */
  .half.top{transform:rotate(180deg)}
  .half.bottom{padding-bottom:env(safe-area-inset-bottom)}
  .half.top{padding-bottom:env(safe-area-inset-top)}

  .head{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
  .lang{font-weight:800;font-size:1.05rem;color:var(--accent)}
  .state{color:var(--muted);font-size:.9rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:9px;height:9px;border-radius:50%;background:#C9C3C7;flex:none}
  .dot.live{background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:ping 1.6s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 9px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}

  .feed{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px;
    -webkit-overflow-scrolling:touch}
  .feed .spacer{flex:1}
  .placeholder{margin:auto;text-align:center;color:var(--muted);font-size:calc(1.5rem * var(--fs));line-height:1.35;padding:10px}

  /* Message de L'AUTRE, traduit dans ma langue : grand et bien lisible */
  .msg{max-width:94%;align-self:flex-start;font-size:calc(1.65rem * var(--fs));line-height:1.3;font-weight:600;
    background:#FBEFF3;border-radius:18px 18px 18px 6px;padding:12px 16px;cursor:pointer;animation:rise .25s ease}
  /* Ce que J'AI dit, transcrit dans ma langue : pour contrôler */
  .msg.own{align-self:flex-end;font-size:calc(1.15rem * var(--fs));font-weight:500;color:#3a3540;
    background:#F1EFF2;border-radius:18px 18px 6px 18px}
  .msg .tag{display:block;font-size:.62em;font-weight:600;color:var(--muted);margin-bottom:3px;letter-spacing:.02em}
  .msg.live::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite;margin-inline-start:2px}
  .msg.playing{outline:3px solid var(--accent2)}
  @keyframes blink{50%{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* Barre centrale : les commandes, au milieu de la table */
  .bar{position:relative;height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .side{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1.5rem;
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--text)}
  /* Haut-parleur : pulse pendant la lecture à voix haute */
  .side.speaking{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-color:transparent;
    animation:breath 1.4s ease-in-out infinite}
  .side .lbl{font-weight:800;font-size:1.05rem}
  #mic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:50%;
    border:5px solid var(--bg);cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#9a9398,#6f6970);box-shadow:0 8px 22px rgba(0,0,0,.18);
    display:flex;align-items:center;justify-content:center}
  #mic svg{width:38px;height:38px}
  #mic.live{background:linear-gradient(135deg,var(--accent2),var(--accent));animation:breath 2s ease-in-out infinite}
  #mic.busy{opacity:.7}
  /* Micro sur OFF : gris et barré */
  #mic.reading{background:linear-gradient(135deg,#9a9398,#6f6970);animation:none}
  #mic.reading::after,
  #mic:not(.live):not(.busy)::after{content:"";position:absolute;left:50%;top:50%;width:50px;height:4px;
    background:#fff;border-radius:2px;transform:translate(-50%,-50%) rotate(-45deg);box-shadow:0 0 0 2px #7d777e}
  /* Ondes de chaque côté du micro : elles bougent avec la voix quand le micro est sur ON */
  .waves{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:4px;height:44px;
    opacity:0;transition:opacity .3s;pointer-events:none}
  .waves.on{opacity:1}
  .waves.left{right:calc(50% + 52px)} .waves.right{left:calc(50% + 52px)}
  .waves i{display:block;width:4px;height:6px;border-radius:2px;background:var(--accent2);transition:height .08s linear}
  @keyframes breath{0%,100%{box-shadow:0 0 0 0 rgba(224,36,94,.45)}50%{box-shadow:0 0 0 14px rgba(224,36,94,0)}}

  /* TABLETTE (iPad) : tout est plus grand, pour lire à travers la table */
  @media (min-width:700px) and (min-height:700px){
    .feed{padding:20px 32px 26px;gap:16px}
    .msg{font-size:calc(2.3rem * var(--fs));padding:16px 22px}
    .msg.own{font-size:calc(1.5rem * var(--fs))}
    .placeholder{font-size:calc(2rem * var(--fs))}
    .head{padding:14px 32px}
    .lang{font-size:1.35rem} .state{font-size:1.1rem}
    .bar{height:92px;padding:0 32px}
    .side{width:72px;height:72px;font-size:2rem}
    .side .lbl{font-size:1.35rem}
    #mic{width:120px;height:120px;border-width:6px}
    #mic svg{width:52px;height:52px}
    #mic:not(.live):not(.busy)::after,#mic.reading::after{width:68px;height:5px}
    .waves{height:60px;gap:6px}
    .waves.left{right:calc(50% + 72px)} .waves.right{left:calc(50% + 72px)}
    .waves i{width:6px}
  }
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;background:rgba(27,27,31,.9);
    color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;font-size:1rem;display:none;text-align:center;pointer-events:none}

  .overlay{position:fixed;inset:0;z-index:40;background:rgba(246,244,245,.96);display:none;align-items:center;
    justify-content:center;padding:28px;text-align:center;flex-direction:column;gap:18px}
  .overlay .m{font-size:1.25rem;font-weight:600;white-space:pre-line;max-width:440px}
</style>
</head>
<body>

<!-- ============ ACCUEIL (client titulaire de la licence) ============ -->
<section id="home">
  <img src="/icons/icon-192.png" alt="">
  <h1>Lichi Live</h1>
  <div class="pair" id="homePair">Dialogue</div>
  <div class="info" id="homeInfo">Checking your license…</div>
  <button id="btnStart" disabled onclick="startDialogue()">Start</button>
  <div class="err" id="homeErr"></div>
</section>

<!-- ============ DIALOGUE (écran partagé, téléphone posé sur la table) ============ -->
<section id="talk">
  <!-- Moitié de la personne EN FACE (retournée) -->
  <div class="half top" id="halfB">
    <div class="head"><span class="dot" id="dotB"></span><span class="lang" id="langB"></span><span class="state" id="stateB" dir="auto"></span></div>
    <div class="feed" id="feedB"><div class="spacer"></div><div class="placeholder" id="phB" dir="auto"></div></div>
  </div>

  <!-- Commandes au centre -->
  <div class="bar">
    <button class="side" id="btnVoice" onclick="readAloud()" aria-label="Read the last translation aloud">🔊</button>
    <div class="waves left" id="wavesL"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="waves right" id="wavesR"><i></i><i></i><i></i><i></i><i></i></div>
    <button id="mic" onclick="toggleMic()" aria-label="Start / pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button class="side" id="btnSize" onclick="cycleSize()" aria-label="Text size"><span class="lbl">Aa</span></button>
  </div>

  <!-- Ma moitié -->
  <div class="half bottom" id="halfA">
    <div class="head"><span class="dot" id="dotA"></span><span class="lang" id="langA"></span><span class="state" id="stateA" dir="auto"></span></div>
    <div class="feed" id="feedA"><div class="spacer"></div><div class="placeholder" id="phA" dir="auto"></div></div>
  </div>
</section>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="m" id="ovMsg"></div><button id="btnStart2" style="border:none;border-radius:999px;padding:16px 34px;font-size:1.1rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#E0245E,#B3124A)" onclick="location.reload()">OK</button></div>

<script>
/* =======================================================================
   LICHI LIVE – DIALOGUE
   Un seul téléphone posé au milieu de la table, écran coupé en deux :
     - en BAS : la personne A (le client, langue de l'hôte de la licence)
     - en HAUT, retourné : la personne B en face (langue du participant)
   Chacun parle quand il veut : la langue est reconnue automatiquement.
   Moteur : MICROSOFT AZURE SPEECH (reconnaissance + traduction), licences comme TalkWithoutBorders.
   ======================================================================= */

/* ---------- Textes de l'interface (une version par moitié d'écran) ---------- */
const UI_BUILTIN = {
  en: {
    tapToStart: "Tap the microphone to start",
    connecting: "Connecting…",
    listening: "Listening — speak in {A} or {B}",
    paused: "Paused — tap the microphone to continue",
    youSaid: "You said",
    voiceOn: "Spoken translation: ON",
    voiceOff: "Spoken translation: OFF",
    retrying: "Connection lost — retrying…",
    inactive: "Paused after 15 minutes without speech.",
    micError: "Microphone unavailable. Please allow microphone access.",
    noHours: "This license has no hours left. Please contact us to top it up.",
    tapReplay: "Tap a message to hear it again",
  },
  he: {
    tapToStart: "הקישו על המיקרופון כדי להתחיל",
    connecting: "מתחבר…",
    listening: "מקשיב — דברו ב{A} או ב{B}",
    paused: "מושהה — הקישו על המיקרופון כדי להמשיך",
    youSaid: "אמרת",
    voiceOn: "תרגום קולי: פועל",
    voiceOff: "תרגום קולי: כבוי",
    retrying: "החיבור נותק — מנסה שוב…",
    inactive: "הושהה לאחר 15 דקות ללא דיבור.",
    micError: "המיקרופון אינו זמין. אנא אשרו גישה למיקרופון.",
    noHours: "לרישיון זה לא נותרו שעות.",
    tapReplay: "הקישו על הודעה כדי לשמוע אותה שוב",
  },
  fr: {
    tapToStart: "Touchez le micro pour commencer",
    connecting: "Connexion…",
    listening: "À l'écoute — parlez en {A} ou en {B}",
    paused: "En pause — touchez le micro pour reprendre",
    youSaid: "Vous avez dit",
    voiceOn: "Traduction orale : ACTIVÉE",
    voiceOff: "Traduction orale : DÉSACTIVÉE",
    retrying: "Connexion perdue — nouvel essai…",
    inactive: "Mis en pause après 15 minutes sans parole.",
    micError: "Micro indisponible. Autorisez l'accès au micro.",
    noHours: "Cette licence n'a plus d'heures disponibles.",
    tapReplay: "Touchez un message pour le réécouter",
  },
};
const UI = { A: UI_BUILTIN.en, B: UI_BUILTIN.he };

async function loadStrings(code) {
  if (UI_BUILTIN[code]) return UI_BUILTIN[code];
  try {
    const r = await fetch("/api/ui-strings", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ lang: code }) });
    const d = await r.json();
    if (r.ok && d.strings) return Object.assign({}, UI_BUILTIN.en, d.strings);
  } catch (e) {}
  return UI_BUILTIN.en;
}

const RTL = ["ar", "he", "fa", "ur", "sd"];

// Nom d'une langue, écrit DANS une autre langue (ex : "Hebrew" en anglais, "אנגלית" en hébreu).
function langName(code, inLang) {
  try { const n = new Intl.DisplayNames([inLang], { type: "language" }).of(code); if (n && n !== code) return n; } catch (e) {}
  return code.toUpperCase();
}
function cap(s) { return s ? s.charAt(0).toLocaleUpperCase() + s.slice(1) : s; }

/* ---------- État ---------- */
const S = {
  A: "en", B: "he",        // A = moi (bas), B = la personne en face (haut)
  licence: null,
  running: false,          // micro ouvert et traduction active
  micStream: null,
  capCtx: null, analyser: null, micSrc: null,
  history: [],             // les répliques terminées (pour la lecture à voix haute)
  size: 1,
};
try { S.size = parseFloat(localStorage.getItem("lichi_size")) || 1; } catch (e) {}

/* =======================================================================
   DÉMARRAGE : vérification de la licence (même système que les autres apps)
   ======================================================================= */
window.addEventListener("load", () => {
  const p = new URLSearchParams(location.search);
  let code = p.get("licence");
  try {
    if (code) localStorage.setItem("lichi_licence", code);
    else code = localStorage.getItem("lichi_licence");
  } catch (e) {}
  checkLicence(code);
});

async function checkLicence(code) {
  const info = document.getElementById("homeInfo");
  if (!code) { info.textContent = ""; homeErr("Access reserved for customers. Please open the license link you were given."); return; }
  try {
    const r = await fetch("/api/licences", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "verify", code }) });
    const d = await r.json();
    if (!r.ok || !d.ok) { info.textContent = ""; homeErr(d.error || "Invalid license."); return; }
    S.licence = d.licence;
    S.A = d.licence.langueHote || "en";
    S.B = d.licence.langueInvite || "he";
    document.getElementById("homePair").textContent =
      "Dialogue · " + S.A.toUpperCase() + " ⇄ " + S.B.toUpperCase();
    info.textContent = d.licence.client + " — " + fmtHours(d.licence.heuresRestantes) + " left · expires " + fmtDate(d.licence.expiration);
    document.getElementById("btnStart").disabled = false;
    // On prépare les textes des deux moitiés pendant que l'utilisateur lit.
    const [a, b] = await Promise.all([loadStrings(S.A), loadStrings(S.B)]);
    UI.A = a; UI.B = b;
  } catch (e) {
    info.textContent = "";
    homeErr("Unable to check your license. Please reload the page.");
  }
}
function homeErr(m) { const e = document.getElementById("homeErr"); e.textContent = m; e.style.display = "block"; }
function fmtHours(h) {
  const t = Math.max(0, Math.round(h * 60)), H = Math.floor(t / 60), M = t % 60;
  return H && M ? H + " h " + M + " min" : H ? H + (H > 1 ? " hours" : " hour") : M + " min";
}
function fmtDate(d) { const p = (d || "").split("-"); return p.length === 3 ? p[1] + "/" + p[2] + "/" + p[0] : d; }

/* Prépare l'écran partagé (langues, sens d'écriture, textes). */
function setupHalves() {
  for (const side of ["A", "B"]) {
    const lang = S[side];
    const half = document.getElementById("half" + side);
    half.setAttribute("dir", RTL.includes(lang.split("-")[0]) ? "rtl" : "ltr");
    half.setAttribute("lang", lang);
    document.getElementById("lang" + side).textContent = cap(langName(lang, lang));
  }
  document.documentElement.style.setProperty("--fs", S.size);
  setStatus("idle");
}

// Statut affiché dans les deux moitiés, chacune dans sa langue.
let lastStatus = "idle";
function setStatus(st) {
  lastStatus = st;
  for (const side of ["A", "B"]) {
    const u = UI[side], lang = S[side];
    let t = "";
    if (st === "idle") t = u.tapToStart;
    else if (st === "connecting") t = u.connecting;
    else if (st === "listening") t = u.listening.replace("{A}", langName(S.A, lang)).replace("{B}", langName(S.B, lang));
    else if (st === "paused") t = u.paused;
    else if (st === "retrying") t = u.retrying;
    document.getElementById("state" + side).textContent = t;
    document.getElementById("dot" + side).classList.toggle("live", st === "listening");
    const ph = document.getElementById("ph" + side);
    if (ph) ph.textContent = st === "listening" ? u.tapReplay : t;
  }
  const mic = document.getElementById("mic");
  mic.classList.toggle("live", st === "listening" || st === "retrying");
  mic.classList.toggle("busy", st === "connecting");
}

/* =======================================================================
   BOUTONS
   ======================================================================= */
async function startDialogue() {
  document.getElementById("home").style.display = "none";
  document.getElementById("talk").classList.add("on");
  setupHalves();
  await startListening();   // même geste : débloque le son ET le micro (iPhone)
}

function toggleMic() {
  if (S.running) pauseListening("paused");
  else startListening();
}

function cycleSize() {
  const tailles = [0.85, 1, 1.25, 1.5];
  S.size = tailles[(tailles.indexOf(S.size) + 1) % tailles.length] || 1;
  try { localStorage.setItem("lichi_size", S.size); } catch (e) {}
  document.documentElement.style.setProperty("--fs", S.size);
}

let toastTimer = null;
function toast(a, b) {
  const t = document.getElementById("toast");
  t.textContent = "";
  const l1 = document.createElement("div"); l1.textContent = a;
  const l2 = document.createElement("div"); l2.textContent = b; l2.style.transform = "rotate(180deg)"; l2.style.marginBottom = "8px";
  if (b && b !== a) t.appendChild(l2);
  t.appendChild(l1);
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = "none"), 1600);
}

/* =======================================================================
   ÉCOUTE : moteur MICROSOFT AZURE SPEECH (comme l'application WordPress)
   - un seul flux : Azure reconnaît automatiquement laquelle des DEUX
     langues est parlée, transcrit (modèle spécialisé, ex : hébreu he-IL)
     et traduit, phrase par phrase ;
   - la clé Azure reste sur le serveur (ticket temporaire /api/azure-token) ;
   - le glossaire de la licence (ex : « ים המלח ») aide la reconnaissance.
   ======================================================================= */
const AZ_REC = {
  en: "en-US", he: "he-IL", fr: "fr-FR", ar: "ar-SA", es: "es-ES", de: "de-DE", it: "it-IT",
  ru: "ru-RU", uk: "uk-UA", pl: "pl-PL", nl: "nl-NL", tr: "tr-TR", el: "el-GR", ja: "ja-JP",
  ko: "ko-KR", "zh-Hans": "zh-CN", "zh-Hant": "zh-TW", "pt-BR": "pt-BR", "pt-PT": "pt-PT",
  hi: "hi-IN", th: "th-TH", vi: "vi-VN", id: "id-ID", sv: "sv-SE", da: "da-DK", no: "nb-NO",
  fi: "fi-FI", cs: "cs-CZ", sk: "sk-SK", hu: "hu-HU", ro: "ro-RO", bg: "bg-BG", hr: "hr-HR",
  fa: "fa-IR", ur: "ur-IN", ms: "ms-MY", ca: "ca-ES", sw: "sw-KE", ta: "ta-IN", te: "te-IN",
  bn: "bn-IN", gu: "gu-IN", mr: "mr-IN", kn: "kn-IN", ml: "ml-IN", am: "am-ET", hy: "hy-AM",
  ka: "ka-GE", az: "az-AZ", kk: "kk-KZ", uz: "uz-UZ", sr: "sr-RS", sl: "sl-SI", et: "et-EE",
  lv: "lv-LV", lt: "lt-LT", mk: "mk-MK", sq: "sq-AL", is: "is-IS", gl: "gl-ES", eu: "eu-ES",
  fil: "fil-PH", af: "af-ZA", zu: "zu-ZA", km: "km-KH", lo: "lo-LA", my: "my-MM", si: "si-LK",
  ne: "ne-NP", mn: "mn-MN", jv: "jv-ID", pa: "pa-IN",
};
const AZ_TGT = { "pt-BR": "pt", "pt-PT": "pt-pt", no: "nb", "zh-Hans": "zh-Hans", "zh-Hant": "zh-Hant" };
function recLocale(c) { return AZ_REC[c] || c; }
function tgtCode(c) { return AZ_TGT[c] || c.split("-")[0]; }

let recognizer = null, azToken = null, azRegion = null, azTokenAt = 0, tokenTimer = null, restartTimer = null;

async function getAzureToken(force) {
  if (!force && azToken && Date.now() - azTokenAt < 8 * 60 * 1000) return azToken;
  const r = await fetch("/api/azure-token", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: S.licence && S.licence.code }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.token) throw new Error(d.error || "token refused");
  azToken = d.token; azRegion = d.region; azTokenAt = Date.now();
  return azToken;
}

async function startListening() {
  if (S.running || !S.licence) return;
  if (typeof SpeechSDK === "undefined") { toast("Speech engine not loaded — check the connection", ""); return; }
  setStatus("connecting");
  unlockAudio();
  S.running = true;
  try {
    await startRecognizer();
    if (S.running) setStatus("listening");
  } catch (e) {
    S.running = false;
    releaseMic();
    setStatus("idle");
    toast(/micro|permission|NotAllowed/i.test(String(e && (e.name || e.message))) ? UI.A.micError : ("⚠️ " + (e.message || e)), "");
    return;
  }
  startLicenceClock();
  noteActivity();
  startInactivityWatch();
  keepScreenOn(true);
}

function pauseListening(st) {
  S.running = false;
  clearTimeout(restartTimer);
  stopSpeaking();
  stopRecognizer();
  releaseMic();
  stopLicenceClock();
  stopInactivityWatch();
  keepScreenOn(false);
  finalizeCurrent();
  setStatus(st || "paused");
}

async function startRecognizer() {
  if (recognizer) return;
  if (!S.micStream) S.micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  await prepareCapture();
  const token = await getAzureToken();
  if (!S.running || speaking) { releaseMic(); return; }

  const cfg = SpeechSDK.SpeechTranslationConfig.fromAuthorizationToken(token, azRegion);
  cfg.speechRecognitionLanguage = recLocale(S.A);
  cfg.addTargetLanguage(tgtCode(S.A));
  cfg.addTargetLanguage(tgtCode(S.B));
  try { cfg.setProperty(SpeechSDK.PropertyId.SpeechServiceConnection_LanguageIdMode, "Continuous"); } catch (e) {}
  const auto = SpeechSDK.AutoDetectSourceLanguageConfig.fromLanguages([recLocale(S.A), recLocale(S.B)]);
  const audio = SpeechSDK.AudioConfig.fromStreamInput(S.micStream);
  const r = (typeof SpeechSDK.TranslationRecognizer.FromConfig === "function")
    ? SpeechSDK.TranslationRecognizer.FromConfig(cfg, auto, audio)
    : new SpeechSDK.TranslationRecognizer(cfg, auto, audio);

  // Glossaire de la licence : mots et expressions à bien reconnaître.
  try {
    const terms = (S.licence.glossaire || []).filter(Boolean);
    if (terms.length) { const pl = SpeechSDK.PhraseListGrammar.fromRecognizer(r); terms.forEach((t) => pl.addPhrase(t)); }
  } catch (e) {}

  r.recognizing = (s, e) => { if (recognizer === r) onAzure(e.result, false); };
  r.recognized = (s, e) => {
    if (recognizer !== r) return;
    if (e.result && e.result.reason === SpeechSDK.ResultReason.TranslatedSpeech) onAzure(e.result, true);
  };
  r.canceled = (s, e) => {
    if (recognizer !== r) return;
    recognizer = null;
    try { r.close(); } catch (x) {}
    if (!S.running) return;
    setStatus("retrying");
    clearTimeout(restartTimer);
    restartTimer = setTimeout(retryRecognizer, 1500);
  };
  recognizer = r;
  await new Promise((res, rej) => r.startContinuousRecognitionAsync(res, (err) => { recognizer = null; rej(new Error(err)); }));

  // Le ticket Azure dure 10 minutes : on le renouvelle toutes les 8 minutes.
  clearInterval(tokenTimer);
  tokenTimer = setInterval(async () => {
    try { const t = await getAzureToken(true); if (recognizer) recognizer.authorizationToken = t; } catch (e) {}
  }, 8 * 60 * 1000);
}

function retryRecognizer() {
  if (!S.running || speaking || recognizer) return;
  startRecognizer()
    .then(() => { if (S.running && recognizer) setStatus("listening"); })
    .catch(() => { clearTimeout(restartTimer); restartTimer = setTimeout(retryRecognizer, 3000); });
}

function stopRecognizer() {
  clearInterval(tokenTimer);
  const r = recognizer;
  recognizer = null;
  if (!r) return Promise.resolve();
  return new Promise((res) => {
    const fin = () => { try { r.close(); } catch (e) {} res(); };
    try { r.stopContinuousRecognitionAsync(fin, fin); } catch (e) { fin(); }
  });
}

/* ---------- Micro : ondes animées + coupure complète pendant la lecture ---------- */
async function prepareCapture() {
  if (!S.capCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    S.capCtx = new Ctx();
    S.analyser = S.capCtx.createAnalyser(); S.analyser.fftSize = 512;
    animateWaves();
  }
  try { await S.capCtx.resume(); } catch (e) {}
  attachMic();
}
function attachMic() {
  if (!S.capCtx || !S.micStream) return;
  if (S.micSrc) { try { S.micSrc.disconnect(); } catch (e) {} }
  S.micSrc = S.capCtx.createMediaStreamSource(S.micStream);
  S.micSrc.connect(S.analyser);
}
function releaseMic() {
  if (S.micSrc) { try { S.micSrc.disconnect(); } catch (e) {} S.micSrc = null; }
  if (S.micStream) { try { S.micStream.getTracks().forEach((t) => t.stop()); } catch (e) {} S.micStream = null; }
}
// Coupe tout pendant la lecture à voix haute (le micro n'entend pas la tablette).
function muteForReading() {
  clearTimeout(restartTimer);
  stopRecognizer();
  releaseMic();
}
// Après la lecture : on rallume le micro et la reconnaissance.
function resumeMic() {
  if (!S.running || speaking || recognizer) return;
  startRecognizer()
    .then(() => { if (S.running && recognizer) setStatus("listening"); })
    .catch(() => { setStatus("retrying"); clearTimeout(restartTimer); restartTimer = setTimeout(retryRecognizer, 2000); });
}

let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  try { const a = new Audio(); a.play().catch(() => {}); audioUnlocked = true; } catch (e) {}
}

/* =======================================================================
   QUI PARLE ? Azure le dit directement (langue détectée : ex. « he-IL »).
   En secours, l'alphabet du texte (hébreu / latin…) départage.
   ======================================================================= */
const SCRIPTS = {
  he: "Hebrew", ar: "Arabic", fa: "Arabic", ur: "Arabic", sd: "Arabic",
  ru: "Cyrillic", uk: "Cyrillic", bg: "Cyrillic", sr: "Cyrillic", mk: "Cyrillic", be: "Cyrillic", kk: "Cyrillic", mn: "Cyrillic",
  el: "Greek", hy: "Armenian", ka: "Georgian", hi: "Devanagari", mr: "Devanagari", ne: "Devanagari",
  bn: "Bengali", gu: "Gujarati", pa: "Gurmukhi", ta: "Tamil", te: "Telugu", kn: "Kannada", ml: "Malayalam",
  si: "Sinhala", th: "Thai", lo: "Lao", km: "Khmer", my: "Myanmar", am: "Ethiopic",
  ja: "Hiragana", ko: "Hangul", zh: "Han",
};
function scriptOf(lang) { return SCRIPTS[lang.split("-")[0]] || "Latin"; }
function countScript(text, script) {
  let re;
  try { re = script === "Hiragana" ? /[\p{Script=Hiragana}\p{Script=Katakana}]/gu : new RegExp("\\p{Script=" + script + "}", "gu"); }
  catch (e) { return 0; }
  return (text.match(re) || []).length;
}
function speakerOf(detected, text) {
  const d = String(detected || "").toLowerCase().split("-")[0];
  const a = S.A.toLowerCase().split("-")[0], b = S.B.toLowerCase().split("-")[0];
  if (d && d === b) return "B";
  if (d && d === a) return "A";
  if (scriptOf(S.A) !== scriptOf(S.B) && text) {
    const na = countScript(text, scriptOf(S.A)), nb = countScript(text, scriptOf(S.B));
    if (na + nb >= 2) return nb > na ? "B" : "A";
  }
  return current ? current.speaker : null;
}

/* =======================================================================
   AFFICHAGE : chaque phrase apparaît dans les deux moitiés
   - chez celui qui parle : sa propre phrase (pour contrôler)
   - chez l'autre : la traduction, en grand
   ======================================================================= */
let current = null;   // la phrase en cours { speaker, own, trans, elA, elB }

function onAzure(result, final) {
  if (!result) return;
  let detected = result.language || "";      // ex : « he-IL » ou « en-US »
  if (!detected) { try { detected = SpeechSDK.AutoDetectSourceLanguageResult.fromResult(result).language || ""; } catch (e) {} }
  const own = (result.text || "").trim();
  const sp = speakerOf(detected, own);
  if (!sp) return;
  const other = sp === "A" ? S.B : S.A;
  let tr = "";
  try {
    const T = result.translations, want = tgtCode(other).toLowerCase();
    tr = (T && T.get(tgtCode(other))) || "";
    if (!tr && T && T.languages) for (const k of T.languages) if (String(k).toLowerCase() === want) tr = T.get(k) || "";
  } catch (e) {}
  if (!own && !tr) return;
  noteActivity();
  // Pendant la phrase, Azure peut corriger la langue détectée : on déplace la bulle.
  if (current && current.speaker !== sp) {
    if (current.elA) current.elA.remove();
    if (current.elB) current.elB.remove();
    current = null;
  }
  if (!current) current = { speaker: sp, own: "", trans: "", elA: null, elB: null };
  current.own = own;
  if (tr) current.trans = tr;
  render(current, !final);
  if (final) finalizeCurrent();
}

function finalizeCurrent() {
  if (!current) return;
  if (current.own || current.trans) {
    render(current, false);
    S.history.push(current);
    if (S.history.length > 60) S.history.shift();
  }
  current = null;
}

function bubble(feed, own, label) {
  const ph = feed.querySelector(".placeholder"); if (ph) ph.remove();
  const el = document.createElement("div");
  el.className = "msg live" + (own ? " own" : "");
  el.setAttribute("dir", "auto");
  if (own) { const t = document.createElement("span"); t.className = "tag"; t.textContent = label; el.appendChild(t); }
  const tx = document.createElement("span"); tx.className = "tx"; el.appendChild(tx);
  feed.appendChild(el);
  const msgs = feed.querySelectorAll(".msg");
  if (msgs.length > 40) msgs[0].remove();
  return el;
}

function render(u, live) {
  const speakerFeed = document.getElementById("feed" + u.speaker);
  const listener = u.speaker === "A" ? "B" : "A";
  const listenerFeed = document.getElementById("feed" + listener);
  const own = (u.own || "").trim(), tr = (u.trans || "").trim();
  if (own) {
    if (!u["el" + u.speaker]) u["el" + u.speaker] = bubble(speakerFeed, true, UI[u.speaker].youSaid);
    u["el" + u.speaker].querySelector(".tx").textContent = own;
  }
  if (tr) {
    if (!u["el" + listener]) {
      const el = bubble(listenerFeed, false);
      const ref = u; el.onclick = () => replay(ref);
      u["el" + listener] = el;
    }
    u["el" + listener].querySelector(".tx").textContent = tr;
  }
  for (const el of [u.elA, u.elB]) if (el) el.classList.toggle("live", live);
  if (u.elA && own && u.speaker === "A") u.elA.onclick = () => replay(u);
  if (u.elB && own && u.speaker === "B") u.elB.onclick = () => replay(u);
  for (const f of [speakerFeed, listenerFeed]) f.scrollTop = f.scrollHeight;
}

/* =======================================================================
   LECTURE À VOIX HAUTE (bouton haut-parleur)
   Un appui : la tablette lit EN ENTIER la dernière réplique traduite
   (une ou plusieurs phrases de la même personne), avec la voix de
   synthèse de l'appareil. Un second appui arrête la lecture.
   Pendant la lecture, le micro n'envoie rien (pas de retraduction).
   ======================================================================= */
const TTS_LANG = {
  en: "en-US", he: "he-IL", fr: "fr-FR", ar: "ar-SA", es: "es-ES", de: "de-DE", it: "it-IT",
  ru: "ru-RU", uk: "uk-UA", pl: "pl-PL", nl: "nl-NL", tr: "tr-TR", el: "el-GR", ja: "ja-JP",
  ko: "ko-KR", "zh-Hans": "zh-CN", "zh-Hant": "zh-TW", "pt-BR": "pt-BR", "pt-PT": "pt-PT",
  hi: "hi-IN", th: "th-TH", vi: "vi-VN", id: "id-ID", sv: "sv-SE", da: "da-DK", no: "nb-NO",
  fi: "fi-FI", cs: "cs-CZ", sk: "sk-SK", hu: "hu-HU", ro: "ro-RO", bg: "bg-BG", hr: "hr-HR",
  fa: "fa-IR", ur: "ur-PK", ms: "ms-MY", ca: "ca-ES",
};
let voices = [];
function loadVoices() { try { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; } catch (e) {} }
if (window.speechSynthesis) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }

function pickVoice(code) {
  const full = (TTS_LANG[code] || code).toLowerCase();
  const base = code.split("-")[0].toLowerCase();
  const norm = (v) => v.lang.replace("_", "-").toLowerCase();
  const bases = base === "he" ? ["he", "iw"] : [base];   // ancien code de l'hébreu sur Android
  return voices.find((v) => norm(v) === full)
      || voices.find((v) => bases.some((b) => norm(v).startsWith(b)))
      || null;
}

let speaking = false, speakWatchdog = null, speakToken = 0;

function setSpeaking(on) {
  speaking = on;
  document.getElementById("btnVoice").classList.toggle("speaking", on);
  // Le micro est COUPÉ pendant la lecture, puis rallumé automatiquement.
  document.getElementById("mic").classList.toggle("reading", on);
  if (on) muteForReading();
  else resumeMic();
  if (!on) document.querySelectorAll(".msg.playing").forEach((m) => m.classList.remove("playing"));
}

function stopSpeaking() {
  speakToken++;
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  clearTimeout(speakWatchdog);
  setSpeaking(false);
}

// Bouton haut-parleur
function readAloud() {
  if (speaking) { stopSpeaking(); return; }
  const list = S.history.slice();
  if (current && (current.trans || "").trim()) list.push(current);
  let i = list.length - 1;
  while (i >= 0 && !(list[i].trans || "").trim()) i--;
  if (i < 0) return;
  // On lit toute la dernière intervention de la même personne (une ou plusieurs bulles).
  const sp = list[i].speaker, group = [];
  while (i >= 0 && list[i].speaker === sp && group.length < 6) {
    if ((list[i].trans || "").trim()) group.unshift(list[i]);
    i--;
  }
  speakUtterances(group);
}

// Toucher une bulle : on lit cette réplique traduite.
function replay(u) { stopSpeaking(); speakUtterances([u]); }

function speakUtterances(group) {
  if (!group.length) return;
  const sp = group[0].speaker;
  const lang = sp === "A" ? S.B : S.A;                 // la traduction est dans la langue de l'AUTRE
  const items = group.map((u) => ({ text: u.trans.trim(), el: sp === "A" ? u.elB : u.elA }));
  if (!window.speechSynthesis) return;
  speakTTS(items, lang, pickVoice(lang));
}

function speakTTS(items, lang, voice) {
  const token = ++speakToken;
  // (sur iPhone, annuler juste avant de parler peut avaler la phrase : seulement si nécessaire)
  try { if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); } catch (e) {}
  setSpeaking(true);
  const phrases = [];
  for (const it of items) {
    const parts = it.text.match(/[^.!?؟。]+[.!?؟。]*/g) || [it.text];
    parts.forEach((t, k) => { if (t.trim()) phrases.push({ t: t.trim(), el: it.el, first: k === 0, last: k === parts.length - 1 }); });
  }
  let total = 0;
  phrases.forEach((ph, idx) => {
    const u = new SpeechSynthesisUtterance(ph.t);
    u.lang = TTS_LANG[lang] || lang;
    if (voice) u.voice = voice;
    u.rate = 0.95;
    u.onstart = () => { if (token === speakToken && ph.el) ph.el.classList.add("playing"); };
    u.onend = () => {
      if (token !== speakToken) return;
      if (ph.last && ph.el) ph.el.classList.remove("playing");
      if (idx === phrases.length - 1) { clearTimeout(speakWatchdog); setSpeaking(false); }
    };
    u.onerror = u.onend;
    total += ph.t.length;
    speechSynthesis.speak(u);
  });
  // Sécurité : certains iPhone oublient de signaler la fin de lecture.
  clearTimeout(speakWatchdog);
  speakWatchdog = setTimeout(() => { if (token === speakToken) setSpeaking(false); }, 4000 + total * 110);
}

/* Ondes animées autour du micro (niveau sonore réel du micro). */
function animateWaves() {
  const L = document.querySelectorAll("#wavesL i"), Rr = document.querySelectorAll("#wavesR i");
  const shape = [0.45, 0.7, 1, 0.8, 0.55];
  const buf = new Uint8Array(512);
  let smooth = 0;
  const tick = () => {
    const on = S.running && !speaking;
    document.getElementById("wavesL").classList.toggle("on", on);
    document.getElementById("wavesR").classList.toggle("on", on);
    if (on && S.analyser) {
      S.analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / buf.length);
      smooth = smooth * 0.6 + Math.min(1, rms * 6) * 0.4;
      const t = performance.now() / 180;
      for (let k = 0; k < 5; k++) {
        const vivant = 0.18 + 0.12 * Math.sin(t + k);            // petit mouvement même en silence
        const h = 6 + (innerWidth >= 700 ? 50 : 36) * Math.min(1, (smooth + vivant * 0.35) * shape[k] * 1.4);
        L[4 - k].style.height = h + "px"; Rr[k].style.height = h + "px";
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* =======================================================================
   LICENCE : décompte d'une minute toutes les 60 s pendant l'écoute
   ======================================================================= */
let licTimer = null;
function startLicenceClock() {
  if (licTimer || !S.licence) return;
  licTimer = setInterval(async () => {
    try {
      const r = await fetch("/api/licences", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "use", code: S.licence.code, minutes: 1 }) });
      const d = await r.json();
      if ((r.ok && d.ok && d.heuresRestantes <= 0) || (d && d.ok === false)) noHours();
    } catch (e) {}
  }, 60000);
}
function stopLicenceClock() { if (licTimer) { clearInterval(licTimer); licTimer = null; } }
function noHours() { pauseListening("idle"); showOverlay(UI.A.noHours); }

/* Pause automatique après 15 minutes sans aucune parole. */
const INACTIVE_MAX = 15 * 60 * 1000;
let lastActivity = Date.now(), inactTimer = null;
function noteActivity() { lastActivity = Date.now(); }
function startInactivityWatch() {
  if (inactTimer) return;
  inactTimer = setInterval(() => {
    if (Date.now() - lastActivity > INACTIVE_MAX) { pauseListening("paused"); toast(UI.A.inactive, UI.B.inactive); }
  }, 30000);
}
function stopInactivityWatch() { if (inactTimer) { clearInterval(inactTimer); inactTimer = null; } }

/* L'écran reste allumé pendant le dialogue (le téléphone est posé sur la table). */
let wakeLock = null;
async function keepScreenOn(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.running) {
    keepScreenOn(true);
    if (S.playCtx) S.playCtx.resume().catch(() => {});
    if (S.capCtx) S.capCtx.resume().catch(() => {});
  }
});

function showOverlay(m) {
  document.getElementById("ovMsg").textContent = m;
  document.getElementById("overlay").style.display = "flex";
}
</script>
